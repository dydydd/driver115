name: Publish to crates.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 需要打版本 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: |
          cargo fmt --check || true
          cargo check --all-targets

      - name: Read crate version
        id: ver
        run: |
          V=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"

      - name: Skip if version already published
        id: published
        run: |
          V=${{ steps.ver.outputs.version }}
          CODE=$(curl -s -A "driver115-ci" -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/driver115/$V")
          if [ "$CODE" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "版本 $V 已存在, 跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.published.outputs.skip != 'true'
        run: cargo package --allow-dirty

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Tag release
        if: steps.published.outputs.skip != 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V" || true
          git push origin "v$V" || true
