[package]
name = "driver115"
version = "0.1.0"
edition = "2021"
description = "Pure Rust client for 115.com: file listing, share snapshot/receive, offline tasks, QR login, rapid upload (115 cipher port)"
license = "MIT"
repository = "https://github.com/dydydd/driver115"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha1 = "0.10"
md5 = "0.7"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
lz4_flex = "0.11"
crc32fast = "1"
tracing = "0.1"
